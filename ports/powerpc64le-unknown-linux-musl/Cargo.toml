[package]
name = "libffi-powerpc64le-musl-c2rust"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "C2Rust port of bundled libffi for powerpc64le Linux musl"
build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[build-dependencies]
cc = "1"
