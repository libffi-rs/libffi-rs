[package]
name = "libffi-loongarch64-c2rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
build = "build.rs"
autobins = false

[lib]
name = "ffi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
c2rust-bitfields = "0.22.1"

[build-dependencies]
cc = "1"
